# vazhi.thodari - Scene & Render Configuration
# Press 'R' during render to hot-reload camera/ibl/render sections

# ─── Scene Setup (read once at startup) ──────────────────────────

[scene]
width = 1544
height = 1080

# IBL environment maps (loaded at startup, switchable via ibl.map_index)
[[scene.ibl_maps]]
path = "kloofendal_48d_partly_cloudy_puresky_4k.hdr"
name = "Cloud Noon"

[[scene.ibl_maps]]
path = "noon_grass_4k.hdr"
name = "Afternoon"

[[scene.ibl_maps]]
path = "umhlanga_sunrise_4k.hdr"
name = "Interior - Morning"

[[scene.ibl_maps]]
path = "golden_bay_4k.hdr"
name = "Interior - Night"

# ─── Named Materials ─────────────────────────────────────────────
# Referenced by shapes via "material" key.
# Meshes loaded via Assimp use their own embedded materials.

[materials.grey_floor]
Kd = [0.7, 0.7, 0.7]
Ks = [0.04, 0.04, 0.04]
alpha = 10.0

[materials.purple]
Kd = [0.9, 0.4, 0.9]
Ks = [0.0, 0.0, 0.0]
alpha = 2000.0

[materials.bronze]
Kd = [0.15, 0.1, 0.05]
Ks = [0.7, 0.55, 0.3]
alpha = 80.0

[materials.stone]
Kd = [0.8, 0.8, 0.75]
Ks = [0.15, 0.15, 0.15]
alpha = 30.0

[materials.light_white]
type = "light"
emission = [1.0, 1.0, 1.0]

# ─── Scene Geometry ──────────────────────────────────────────────

# Meshes: loaded via Assimp with their own materials
[[mesh]]
path = "San_Miguel/San_Miguel.gltf"
position = [0.0, 0.0, 0.0]
scale = 1.0
# yaw = 0.0                   # optional, degrees

# Uncomment to load other scenes:
# [[mesh]]
# path = "Bistro/Interior/Interior.gltf"
# position = [0.0, 0.0, 0.0]
# scale = 1.0

# [[mesh]]
# path = "sponza_v2/base/base.gltf"
# position = [0.0, 0.0, 0.0]
# scale = 1.0

# Primitives (reference named materials)
# [[sphere]]
# position = [0.0, 0.4, -0.5]
# radius = 0.4
# material = "purple"

# [[box]]
# corner = [-2, -0.01, -2]
# diagonal = [4, 0.01, 4]
# material = "grey_floor"

# ─── Hot-Reloadable Settings ─────────────────────────────────────

[camera]
ry = 0.8
yaw = -45.0
pitch = 10.0

[camera.position]
x = 8.5
y = 2.0
z = 7.0

[ibl]
map_index = 0
rotation = 0.0       # degrees
intensity = 1.0

[area_light]
emit_scale = 1.0

[render]
max_passes = 2048
write_interval = 5
noise_threshold = 0.0005
russian_roulette = 0.8
clamp_lights = false
clamp_factor = 200.0
clamp_weights = false
weight_clamp_factor = 200.0
