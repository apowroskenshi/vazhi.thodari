# ════════════════════════════════════════════════════════════════
# Camera presets (converted from camera.txt)
#
# Each block below is a drop-in replacement for the [camera],
# [camera.position], [ibl] and [area_light] sections in config.toml.
# Uncomment exactly one block and paste it over those sections.
#
# Source column order:
#   x  y  z  ry  yaw  pitch  map_index  ibl_rotation  ibl_intensity  emit_scale
#
# IBL map_index reference:
#   0 = Cloud Noon            (kloofendal_48d_partly_cloudy_puresky)
#   1 = Afternoon             (noon_grass)
#   2 = Night                 (dikhololo_night)
#   3 = Interior - Morning    (umhlanga_sunrise)
#   4 = Interior - Night      (golden_bay)
# ════════════════════════════════════════════════════════════════


